name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installer and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        shell: pwsh
        run: cargo build --release

      - name: Copy assets to target\release
        shell: pwsh
        run: |
          if (Test-Path assets) { Copy-Item -Path assets -Destination target\release\assets -Recurse -Force }

      - name: Install Inno Setup (winget)
        shell: pwsh
        run: |
          $winget = Get-Command winget -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $winget) { Write-Error "winget が見つかりません"; exit 1 }
          & $winget install --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { Write-Error "winget インストールに失敗しました"; exit 1 }

      - name: Generate versioned installer script
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content -Raw Cargo.toml), '(?ms)\[package\].*?version\s*=\s*"([^"]+)"').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($v)) { Write-Error "Cargo.toml の version が見つかりません"; exit 1 }
          $iss = [System.IO.File]::ReadAllText('scripts\installer.iss', [System.Text.Encoding]::UTF8)
          $iss = $iss -replace '#define MyAppVersion "[^"]*"', ('#define MyAppVersion "' + $v + '"')
          [System.IO.File]::WriteAllText('installer_versioned.iss', $iss)

      - name: Compile installer (iscc)
        shell: pwsh
        run: |
          $isccPath = $null
          $c = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($c) { $isccPath = $c.Source }
          if (-not (Test-Path $isccPath)) {
            $f = Get-ChildItem -Path 'C:\Program Files\*', 'C:\Program Files (x86)\*' -Filter iscc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $isccPath = $f.FullName }
          }
          if (-not $isccPath) { Write-Error "iscc.exe が見つかりません"; exit 1 }
          & $isccPath installer_versioned.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "iscc コンパイルに失敗しました"; exit 1 }

      - name: Ensure release exists
        shell: pwsh
        run: |
          $content = Get-Content -Raw Cargo.toml
          $v = [regex]::Match($content, '(?ms)\[package\].*?version\s*=\s*"([^"]+)"').Groups[1].Value
          $tag = if ("$env:GITHUB_REF" -match '^refs/tags/(.+)$') { $Matches[1] } elseif ($v) { "v$v" } else { "" }
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Error "タグが特定できません"; exit 1 }
          gh release view $tag >$null 2>&1
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "winletmeknow $tag" }

      - name: Upload installer to release
        shell: pwsh
        run: |
          $content = Get-Content -Raw Cargo.toml
          $v = [regex]::Match($content, '(?ms)\[package\].*?version\s*=\s*"([^"]+)"').Groups[1].Value
          $tag = if ("$env:GITHUB_REF" -match '^refs/tags/(.+)$') { $Matches[1] } elseif ($v) { "v$v" } else { "" }
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Error "タグが特定できません"; exit 1 }
          $file = "installer\winletmeknow_setup_$v.exe"
          if (-not (Test-Path $file)) {
            $found = Get-ChildItem -Path 'installer\*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $file = $found.FullName }
          }
          if (-not (Test-Path $file)) { Write-Error "インストーラーが見つかりません"; exit 1 }
          gh release upload $tag $file --clobber
