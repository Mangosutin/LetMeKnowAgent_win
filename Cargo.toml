[package]
name = "winletmeknow"
version = "0.1.0"
edition = "2021"
description = "AIエージェント向けWindowsデスクトップ通知デーモン（トレイ常駐 + ローカルHTTP）"
license = "MIT"

[[bin]]
name = "winletmeknow"
path = "src/main.rs"

[dependencies]
winrt-toast = "0.1.1"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
